<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>页面不存在 · 舟友同好集会地图</title>
  <!-- 错误页不参与收录 -->
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="你访问的页面不存在或已被移动。" />
  <meta name="theme-color" content="#070b16" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="stylesheet" href="/css/fonts.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* 与关于页一致：覆盖全局 fixed+overflow:hidden 以便整页滚动 */
    html, body { position: static !important; height: auto !important; overflow-y: auto !important; overflow-x: hidden !important; }
    .nf-page { min-height: 100vh; display: flex; flex-direction: column; }
    .nf-topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 22px; background: linear-gradient(180deg, rgba(18,32,66,0.97), rgba(13,21,48,0.92));
      border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
    }
    .nf-brand { display: flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; }
    .nf-brand .logo { color: var(--ak-primary); }
    .nf-brand span { font-family: 'Noto Sans SC', sans-serif; font-size: 20px; font-weight: 900; letter-spacing: 2px; color: #fff; }
    .nf-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 64px 20px 40px; box-sizing: border-box;
    }
    .nf-card {
      width: 100%; max-width: 560px; text-align: center;
      background: linear-gradient(180deg, rgba(18,32,66,0.95), rgba(7,11,22,0.95));
      border: 1px solid var(--line);
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
      padding: 48px 32px 40px;
    }
    .nf-code {
      font-family: 'Saira', monospace; font-stretch: 112%; font-variant-numeric: tabular-nums; font-size: 84px; font-weight: 700; line-height: 1;
      background: linear-gradient(90deg, #fff, var(--ak-primary));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: 0 4px 24px rgba(74,171,234,0.25);
    }
    .nf-card h1 {
      font-family: 'Noto Sans SC', sans-serif; font-size: 22px; font-weight: 900;
      color: #fff; letter-spacing: 3px; margin: 18px 0 10px;
    }
    .nf-tip { color: var(--text-dim); font-size: 14px; line-height: 1.9; margin: 0 0 6px; }
    .nf-path {
      font-family: 'Saira', monospace; font-stretch: 112%; font-size: 12px; color: var(--text-mute);
      word-break: break-all; margin: 0 0 28px; min-height: 1em;
    }
    .nf-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .nf-actions .ak-btn { text-decoration: none; height: 36px; padding: 0 20px; font-size: 13px; }
    .nf-foot { text-align: center; color: var(--text-mute); font-size: 12px; padding: 20px 0 28px; line-height: 1.8; }
    @media (max-width: 480px) {
      .nf-topbar { padding: 0 12px; }
      .nf-brand span { font-size: 16px; }
      .nf-card { padding: 36px 20px 32px; }
      .nf-code { font-size: 64px; }
    }
  </style>
</head>
<body>
  <div class="nf-page">
    <header class="nf-topbar">
      <a class="nf-brand" href="/">
        <svg class="logo" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7l5 5-5 5-5-5z" fill="currentColor"/></svg>
        <span>舟友同好集会地图</span>
      </a>
      <a href="/about.html" class="ak-btn ak-btn--ghost ak-btn--sm" style="text-decoration:none;">关于本站</a>
    </header>

    <main class="nf-body">
      <section class="nf-card" role="alert">
        <div class="nf-code">404</div>
        <h1>页面不存在</h1>
        <p class="nf-tip">你要找的页面可能已被移动、删除，或从未存在过。</p>
        <p class="nf-tip">如果是活动链接，不妨回到地图搜一下活动名称——它可能换了新的详情页地址。</p>
        <p class="nf-path" id="nf-path"></p>
        <div class="nf-actions">
          <a class="ak-btn ak-btn--primary" href="/">返回地图</a>
          <a class="ak-btn ak-btn--ghost" href="/about.html">关于本站</a>
        </div>
      </section>
    </main>

    <footer class="nf-foot">舟友同好集会地图 · AGPL-3.0 © 2026 Booker786</footer>
  </div>

  <script>
    // 展示用户实际访问的路径，方便反馈排查（仅取路径，不带查询串避免泄露参数）
    try {
      document.getElementById('nf-path').textContent = '访问地址：' + location.pathname;
    } catch (e) {}
  </script>
</body>
</html>
